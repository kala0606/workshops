<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Tool · CAS 2026</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  #qr{display:flex;justify-content:center;margin:34px 0}
  #qr img,#qr canvas{width:min(78vw,420px);height:auto;image-rendering:pixelated}
  #urlbox{width:100%;font-family:var(--mono);font-size:14px;padding:13px 14px;
    border:1px solid var(--hair);border-radius:6px;background:#fff;color:var(--ink)}
  #urlbox:focus{outline:2px solid var(--acc)}
  .row{display:flex;gap:10px;margin:14px 0}
  @media print{
    nav.top,.row,#urlbox,footer{display:none!important}
    #qr img,#qr canvas{width:15cm}
  }
</style>
</head>
<body>
<nav class="top">
  <a href="../../">← Computational Approaches to Sound</a>
  <span class="unit">QR Tool</span>
</nav>
<main>
  <div class="kicker">Deployment Ritual · Step 2</div>
  <h1>URL → QR</h1>
  <p class="lede">Paste a sketch's fullscreen link. Show the code to a phone.
     That's the whole tool.</p>
  <input id="urlbox" type="url" placeholder="https://editor.p5js.org/you/full/…"
         autocomplete="off" spellcheck="false">
  <div class="row">
    <button class="big" id="make">make QR</button>
    <button class="big" id="print" style="background:#6f6a5e">🖨 print poster</button>
  </div>
  <div id="qr"></div>
  <p class="dim" id="shown" style="font-family:var(--mono);font-size:12px;word-break:break-all"></p>
</main>
<script src="../../assets/vendor/qrcode.min.js"></script>
<script>
(function(){
  var box=document.getElementById("urlbox"), holder=document.getElementById("qr");
  var shown=document.getElementById("shown"), qr=null;
  function make(){
    var u=box.value.trim();
    if(!u) return;
    if(!/^https?:\/\//i.test(u)) u="https://"+u;
    holder.innerHTML="";
    qr=new QRCode(holder,{text:u,width:840,height:840,correctLevel:QRCode.CorrectLevel.M});
    shown.textContent=u;
  }
  document.getElementById("make").addEventListener("click",make);
  box.addEventListener("keydown",function(e){if(e.key==="Enter")make();});
  document.getElementById("print").addEventListener("click",function(){window.print();});
})();
</script>
</body>
</html>
